<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-tasks"></i> Task Manager</h1>
            <p>Organize your tasks efficiently</p>
        </header>

        <div class="main-content">
            <!-- Task Form -->
            <div class="task-form-section">
                <h2><i class="fas fa-plus-circle"></i> Add New Task</h2>
                <form id="taskForm">
                    <div class="form-group">
                        <label for="title">Title *</label>
                        <input type="text" id="title" placeholder="Enter task title" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" placeholder="Enter task description" rows="3"></textarea>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="priority">Priority</label>
                            <select id="priority">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="dueDate">Due Date</label>
                            <input type="date" id="dueDate">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status">
                            <option value="pending">Pending</option>
                            <option value="in_progress">In Progress</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-plus"></i> Add Task
                        </button>
                        <button type="button" id="updateBtn" class="btn btn-secondary" style="display: none;">
                            <i class="fas fa-save"></i> Update Task
                        </button>
                        <button type="button" id="cancelBtn" class="btn btn-cancel" style="display: none;">
                            <i class="fas fa-times"></i> Cancel
                        </button>
                    </div>
                </form>
            </div>

            <!-- Task Filters -->
            <div class="filter-section">
                <h2><i class="fas fa-filter"></i> Filter Tasks</h2>
                <div class="filters">
                    <button class="filter-btn active" data-status="all">All Tasks</button>
                    <button class="filter-btn" data-status="pending">Pending</button>
                    <button class="filter-btn" data-status="in_progress">In Progress</button>
                    <button class="filter-btn" data-status="completed">Completed</button>
                    <button class="filter-btn" data-priority="high">High Priority</button>
                </div>
            </div>

            <!-- Task Statistics -->
            <div class="stats-section">
                <div class="stat-card">
                    <h3>Total Tasks</h3>
                    <p id="totalTasks">0</p>
                </div>
                <div class="stat-card">
                    <h3>Pending</h3>
                    <p id="pendingTasks">0</p>
                </div>
                <div class="stat-card">
                    <h3>In Progress</h3>
                    <p id="inProgressTasks">0</p>
                </div>
                <div class="stat-card">
                    <h3>Completed</h3>
                    <p id="completedTasks">0</p>
                </div>
            </div>

            <!-- Task List -->
            <div class="task-list-section">
                <h2><i class="fas fa-list"></i> Task List</h2>
                <div id="taskList" class="task-list">
                    <!-- Tasks will be loaded here -->
                </div>
            </div>
        </div>

        <footer>
            <p>Task Manager &copy; 2024 | Three-Tier Architecture Application</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
